name: Build, Secure & Notify Central Hub

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Call the Central Hub's master security gate first
  security-gate:
    uses: afrodojo/platform-hub/.github/workflows/reusable-sec-gate.yml@main
    with:
      language: 'java' # Change per repo: 'java', 'cpp', 'python', or 'node'

  # 2. Build optimized container (Java JAR, C++ binary, Python worker, or Node app)
  build-and-push:
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Spoke Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # 3. Wake up the Central Hub repo to pull this update into the unified platform
  dispatch-to-hub:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Central Hub Assembly
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HUB_DISPATCH_TOKEN }}
          repository: afrodojo/platform-hub
          event-type: spoke-updated
          client-payload: '{"service": "${{ github.event.repository.name }}", "sha": "${{ github.sha }}"}'
