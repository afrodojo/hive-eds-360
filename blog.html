<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctoral Research Logs & Media Dispatch | The Hive Network</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/auth.js"></script>
</head>
<body class="bg-[#0b0e14] text-gray-200 font-sans p-6">

    <header class="max-w-7xl mx-auto flex items-center justify-between bg-gray-900 p-4 rounded-xl mb-8 border border-gray-800">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white font-bold p-2.5 rounded-lg">DS</div>
            <div>
                <h1 class="text-white font-bold text-lg">The Hive Network</h1>
                <p class="text-xs text-gray-400">Doctoral Research Logs & Media Publication Engine</p>
            </div>
        </div>
        <nav class="flex items-center space-x-6 text-sm">
            <a href="index.html" class="text-gray-400 hover:text-white">Home & Research</a>
            <a href="blog.html" class="text-blue-400 font-semibold border-b-2 border-blue-500 pb-1">Research Logs & Media</a>
            <a href="admin.html" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-semibold text-xs">Admin Console</a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto space-y-8">
        
        <!-- Super-Admin Creator Panel (Active for dassensebsu@pm.me) -->
        <div id="adminPublisherBar" class="bg-gray-900 border-2 border-purple-500/80 rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <span class="bg-purple-950 text-purple-300 text-[10px] font-mono px-2.5 py-1 rounded-full border border-purple-800/50 uppercase font-bold">Super-Admin Publisher Mode</span>
                    <h2 class="text-xl font-bold text-white mt-1">Publish Blog Entry, Documentation, or Social Media Embed</h2>
                </div>
                <span class="text-xs text-gray-400 font-mono">Active User: <strong class="text-purple-400">dassensebsu@pm.me</strong></span>
            </div>

            <form id="publishForm" onsubmit="handleContentPublish(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="postTitle" placeholder="Post / Article Title..." required class="bg-gray-950 border border-gray-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-purple-500">
                    <select id="postCategory" class="bg-gray-950 border border-gray-800 text-xs text-gray-300 rounded-xl p-3 focus:outline-none focus:border-purple-500">
                        <option value="Research Log">Doctoral Research Log</option>
                        <option value="System Documentation">System Documentation & RAG Specs</option>
                        <option value="Social Dispatch">Facebook / Social Media Video Dispatch</option>
                        <option value="CUDA Benchmark">Air-Gapped CUDA Hardware Benchmarks</option>
                    </select>
                </div>

                <input type="url" id="postMediaUrl" placeholder="Embed Media URL (Facebook Video/Post, YouTube Link, or Documentation PDF)..." class="w-full bg-gray-950 border border-gray-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-purple-500 font-mono">

                <textarea id="postContent" rows="4" placeholder="Write full documentation narrative or social commentary..." required class="w-full bg-gray-950 border border-gray-800 text-xs text-white rounded-xl p-3 focus:outline-none focus:border-purple-500"></textarea>

                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center space-x-2 text-xs text-gray-400">
                            <input type="checkbox" id="syndicateFacebook" class="rounded bg-gray-950 border-gray-800 text-purple-600 focus:ring-purple-500" checked>
                            <span>Syndicate to Facebook</span>
                        </label>
                        <label class="flex items-center space-x-2 text-xs text-gray-400">
                            <input type="checkbox" id="syndicateLinkedIn" class="rounded bg-gray-950 border-gray-800 text-purple-600 focus:ring-purple-500" checked>
                            <span>Syndicate to LinkedIn</span>
                        </label>
                    </div>
                    <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-6 py-3 rounded-xl transition shadow-lg shadow-purple-950/40">Publish Article & Dispatch Social Media</button>
                </div>
            </form>
        </div>

        <!-- Published Posts Feed -->
        <section class="space-y-6">
            <h3 class="text-2xl font-bold text-white">Live Dispatches & Documentation Feed</h3>
            <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Posts injected dynamically via JavaScript -->
            </div>
        </section>

    </main>

    <script>
        let postsList = [
            {
                id: 1,
                title: "Air-Gapped CUDA Benchmarks on RTX 4090 Workstations",
                category: "CUDA Benchmark",
                author: "dassensebsu@pm.me",
                date: "Oct 12, 2026",
                content: "Sub-10ms token generation achieved on local air-gapped llama3 70B quantizations. Full documentation attached below.",
                mediaUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
                id: 2,
                title: "Emerging Defense Solutions - Joint Research Dispatch",
                category: "Social Dispatch",
                author: "dassensebsu@pm.me",
                date: "Oct 10, 2026",
                content: "Highlights from our recent technical demonstration on tactical edge computing and zero-trust security.",
                mediaUrl: "https://www.facebook.com/facebook/videos/10153231379946729/"
            }
        ];

        function renderPosts() {
            const feed = document.getElementById("postsFeed");
            feed.innerHTML = "";

            postsList.forEach(post => {
                const mediaHtml = generateMediaEmbed(post.mediaUrl);
                const card = document.createElement("article");
                card.className = "bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-3 flex flex-col justify-between hover:border-gray-700 transition";

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="bg-blue-950 text-blue-400 text-[10px] font-mono px-2.5 py-0.5 rounded-full uppercase">${post.category}</span>
                            <span class="text-xs text-gray-500">${post.date}</span>
                        </div>
                        <h4 class="text-lg font-bold text-white">${post.title}</h4>
                        <p class="text-xs text-gray-400 mt-2 leading-relaxed">${post.content}</p>
                        ${mediaHtml}
                    </div>
                    <div class="pt-4 border-t border-gray-800/60 flex justify-between items-center text-[11px] text-gray-500">
                        <span>Published by: <strong class="text-gray-300">${post.author}</strong></span>
                        <button onclick="deletePost(${post.id})" class="text-red-400 hover:text-red-300">Delete Post</button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function handleContentPublish(e) {
            e.preventDefault();
            const newPost = {
                id: Date.now(),
                title: document.getElementById("postTitle").value,
                category: document.getElementById("postCategory").value,
                author: "dassensebsu@pm.me",
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                content: document.getElementById("postContent").value,
                mediaUrl: document.getElementById("postMediaUrl").value
            };

            postsList.unshift(newPost);
            renderPosts();
            document.getElementById("publishForm").reset();
            alert("Article & Social Media Embed published successfully!");
        }

        function deletePost(id) {
            postsList = postsList.filter(p => p.id !== id);
            renderPosts();
        }

        window.onload = function() {
            renderPosts();
        };
    </script>
</body>
</html>
