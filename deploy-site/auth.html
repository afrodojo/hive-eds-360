<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access & Account Portal | The Hive Network</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0e14; color: #c9d1d9; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="p-6 flex items-center justify-center min-h-screen">
    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-white">The Hive Network Portal</h1>
            <p class="text-xs text-gray-400">Doctor of Applied Science in Computer Science Enclave</p>
        </div>

        <div class="flex border-b border-gray-800 text-sm">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 font-bold text-blue-400 border-b-2 border-blue-500">Sign In</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 font-bold text-gray-400">Create Account</button>
        </div>

        <!-- Auth Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Select Registration Tier</label>
                <select id="regTier" onchange="checkTierDomainRequirement()" class="w-full bg-gray-950 border border-gray-800 p-3 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500">
                    <option value="basic">Basic Member (/mo)</option>
                    <option value="academic">Academic Student/Faculty (/mo - .edu Required)</option>
                    <option value="proposal_partner">Grant & Proposal Partner (.00 - Grant Funded)</option>
                    <option value="business">Business Tier (/mo)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Email Address</label>
                <input type="email" id="authEmail" class="w-full bg-gray-950 border border-gray-800 p-3 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500" placeholder="name@university.edu">
                <p id="domainHelp" class="text-[11px] text-amber-400 font-mono mt-1 hidden">Academic Tier requires a verified active .edu email address.</p>
                <p id="partnerHelp" class="text-[11px] text-emerald-400 font-mono mt-1 hidden">Proposal Partners receive 0.00 billing under grant allocations upon verification.</p>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Password</label>
                <input type="password" id="authPassword" class="w-full bg-gray-950 border border-gray-800 p-3 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••••••">
            </div>
            <button id="authBtn" onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-sm transition">Sign In</button>
        </div>

        <p id="authMessage" class="text-xs text-center text-gray-400"></p>
    </div>

    <script>
        const SUPABASE_URL = "https://wuwndfrpphyylwdvwotj.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentMode = 'login';

        // Check URL parameters if redirected from pricing page
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tier') === 'proposal_partner') {
            document.getElementById('regTier').value = 'proposal_partner';
            switchTab('register');
            checkTierDomainRequirement();
        }

        function checkTierDomainRequirement() {
            const tier = document.getElementById('regTier').value;
            const help = document.getElementById('domainHelp');
            const pHelp = document.getElementById('partnerHelp');
            
            help.classList.add('hidden');
            pHelp.classList.add('hidden');

            if (tier === 'academic') {
                help.classList.remove('hidden');
            } else if (tier === 'proposal_partner') {
                pHelp.classList.remove('hidden');
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            if (mode === 'login') {
                document.getElementById('tabLogin').className = "flex-1 py-2 font-bold text-blue-400 border-b-2 border-blue-500";
                document.getElementById('tabRegister').className = "flex-1 py-2 font-bold text-gray-400";
                document.getElementById('authBtn').innerText = "Sign In";
            } else {
                document.getElementById('tabRegister').className = "flex-1 py-2 font-bold text-blue-400 border-b-2 border-blue-500";
                document.getElementById('tabLogin').className = "flex-1 py-2 font-bold text-gray-400";
                document.getElementById('authBtn').innerText = "Create Account";
            }
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value.trim().toLowerCase();
            const password = document.getElementById('authPassword').value;
            const selectedTier = document.getElementById('regTier').value;
            const msg = document.getElementById('authMessage');

            if (!email || !password) return alert('Please enter both email and password.');

            // Strict .edu Domain Validation for Academic Tier
            if (currentMode === 'register' && selectedTier === 'academic' && !email.endsWith('.edu')) {
                msg.innerHTML = "<span class='text-red-400 font-bold'>Error: Academic Tier registration requires an active university email ending in .edu</span>";
                return;
            }

            msg.innerText = "Processing request...";

            if (currentMode === 'register') {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { tier: selectedTier } }
                });
                if (error) {
                    msg.innerText = "Error: " + error.message;
                } else {
                    msg.innerHTML = "<span class='text-emerald-400 font-bold'>Account created! Check your " + email + " inbox to confirm your active email account.</span>";
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    msg.innerText = "Error: " + error.message;
                } else {
                    localStorage.setItem('hive_user_email', email);
                    msg.innerText = "Authentication successful! Redirecting to Portal...";
                    setTimeout(() => { window.location.href = 'portal.html'; }, 1000);
                }
            }
        }
    </script>
</body>
</html>
