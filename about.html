<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About & Doctoral Journey | Asaad Morman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #030712; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .tile { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(51, 65, 85, 0.6); backdrop-filter: blur(12px); }
        .prose-dark { color: #cbd5e1; }
        .prose-dark h1, .prose-dark h2, .prose-dark h3 { color: #f8fafc; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        .prose-dark p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose-dark a { color: #60a5fa; text-decoration: underline; }
        .prose-dark ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col p-4 space-y-4">

    <!-- Header Navigation -->
    <header class="tile px-4 py-3 rounded-xl flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                🥷
            </div>
            <div>
                <h1 class="text-sm font-bold text-white tracking-wide">ASAAD MORMAN • CYBERDOJOSENSEI</h1>
                <p class="text-[10px] text-blue-400 mono">Doctor of Applied Science (DAS) Candidate • Research Journey</p>
            </div>
        </div>

        <nav class="flex items-center space-x-2 text-xs mono">
            <a href="/" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">Home</a>
            <a href="/portal.html" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">Telemetry Console</a>
            <a href="/blog.html" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded text-slate-300">Research Journal</a>
            <a href="/about.html" class="px-3 py-1 bg-blue-600 text-white rounded font-bold border border-blue-400/30">About & Journey</a>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto w-full space-y-6 flex-1 py-2">
        
        <!-- Live Repo Connection Status Banner -->
        <div class="tile p-4 rounded-xl flex justify-between items-center text-xs mono">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-slate-300">Target Repository: <a href="https://github.com/afrodojo/cyberdojosensei" target="_blank" class="text-blue-400 underline font-bold">afrodojo/cyberdojosensei</a></span>
            </div>
            <span id="syncStatus" class="text-[10px] px-2 py-0.5 bg-blue-950 text-blue-400 border border-blue-800 rounded">FETCHING REPO...</span>
        </div>

        <!-- Rendered Markdown Container -->
        <div class="tile p-6 rounded-2xl space-y-4">
            <div id="repoBioContainer" class="prose-dark text-xs sm:text-sm">
                <div class="p-8 text-center space-y-3 mono text-slate-400">
                    <div class="inline-block w-6 h-6 rounded-full border-2 border-blue-500 border-t-transparent animate-spin"></div>
                    <p>Ingesting README & doctoral journey notes from afrodojo/cyberdojosensei...</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        async function fetchRepoData() {
            const container = document.getElementById('repoBioContainer');
            const statusLabel = document.getElementById('syncStatus');

            const repoEndpoints = [
                'https://raw.githubusercontent.com/afrodojo/cyberdojosensei/main/README.md',
                'https://raw.githubusercontent.com/afrodojo/cyberdojosensei/master/README.md'
            ];

            let markdownText = '';

            for (const url of repoEndpoints) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        markdownText = await res.text();
                        statusLabel.className = 'text-[10px] px-2 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded';
                        statusLabel.innerText = 'REPO TELEMETRY SYNCED';
                        break;
                    }
                } catch (e) {
                    console.warn("Could not fetch " + url);
                }
            }

            if (markdownText && window.marked) {
                container.innerHTML = marked.parse(markdownText);
            } else {
                statusLabel.className = 'text-[10px] px-2 py-0.5 bg-blue-950 text-blue-400 border border-blue-800 rounded';
                statusLabel.innerText = 'PROFILE OPERATIONAL';
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="border-b border-slate-800 pb-3">
                            <h1 class="text-xl font-bold text-white">Asaad Morman (CyberDojoSensei)</h1>
                            <p class="text-xs text-blue-400 mono">Doctor of Applied Science in Computer Science Candidate</p>
                        </div>
                        <p class="text-slate-300 leading-relaxed">Connected to <a href="https://github.com/afrodojo/cyberdojosensei" target="_blank" class="text-blue-400 underline">afrodojo/cyberdojosensei</a>. Tracking doctoral research milestones, zero-trust enclave experiments, FIPS key decay analysis, and edge telemetry ingestion.</p>
                    </div>
                `;
            }
        }

        document.addEventListener("DOMContentLoaded", fetchRepoData);
    </script>
</body>
</html>
